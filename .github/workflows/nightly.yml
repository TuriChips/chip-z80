# Nightly: full C8 on the RTL (64 seeds x 1000 instr, coverage enforced). Zexdoc is in zexdoc.yml (sharded), not here.
name: nightly
on:
  schedule: [{ cron: "30 20 * * *" }]   # 02:00 IST
  workflow_dispatch:
jobs:
  nightly:
    runs-on: ubuntu-24.04
    timeout-minutes: 350   # hosted cap is 6h; the C8 run takes ~1h
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: TuriChips/toolchain
          ref: v0.10.2
          path: .toolchain
          token: ${{ secrets.TOOLCHAIN_TOKEN || github.token }}
      - run: sudo apt-get update && sudo apt-get install -y verilator yosys make iverilog python3
      - run: make nightly
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: nightly-logs, path: logs/ }
