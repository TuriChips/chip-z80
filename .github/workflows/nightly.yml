# Long acceptance tests (zexdoc: hours). Skips cleanly until tests/acceptance/run.sh exists.
name: nightly
on:
  schedule: [{ cron: "30 20 * * *" }]   # 02:00 IST
  workflow_dispatch:
jobs:
  nightly:
    runs-on: ubuntu-24.04
    timeout-minutes: 350   # GitHub-hosted jobs are capped at 6h; if zexdoc needs longer, split it or use a self-hosted runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: TuriChips/toolchain
          ref: v0.10.1
          path: .toolchain
          token: ${{ secrets.TOOLCHAIN_TOKEN || github.token }}
      - run: sudo apt-get update && sudo apt-get install -y verilator yosys make iverilog python3
      - run: make nightly
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: nightly-logs, path: logs/ }
